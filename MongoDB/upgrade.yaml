---
- name: Upgrade MongoDB from 4.0 to 7.0
  hosts: mongodb_servers
  become: true
  vars:
    mongodb_version: "4.0"           # current installed version
    target_mongodb_version: "7.0"
    backup_dir: "/var/backups/mongodb/{{ ansible_date_time.date }}"   # fixed: was placeholder path
    test_db: "test_db"
    test_collection: "test_collection"
    test_data: '{"name": "test", "value": 1}'
    upgrade_versions:
      - "4.2"
      - "4.4"
      - "5.0"
      - "6.0"    # CRITICAL FIX: was missing — MongoDB requires sequential major version upgrades
      - "7.0"

  tasks:
    - name: Stop MongoDB service
      ansible.builtin.service:
        name: mongod
        state: stopped

    - name: Backup MongoDB data
      ansible.builtin.command: "mongodump --out {{ backup_dir }}"
      # Removed: args: warn: false  — deprecated and removed in Ansible 2.14+
      register: backup_output
      changed_when: backup_output.rc == 0

    - name: Fail if backup failed
      ansible.builtin.fail:
        msg: "MongoDB backup failed. Aborting upgrade to protect data."
      when: backup_output.rc != 0

    - name: Start MongoDB service
      ansible.builtin.service:
        name: mongod
        state: started

    - name: Insert test data into MongoDB
      ansible.builtin.command: >
        mongosh {{ test_db }}
        --eval 'db.{{ test_collection }}.insertOne({{ test_data }})'
      # fixed: was 'mongo' — deprecated since MongoDB 5.0, removed in 6.0; use 'mongosh'
      register: insert_test_data_output

    - name: Verify test data insertion
      ansible.builtin.command: >
        mongosh {{ test_db }}
        --eval 'db.{{ test_collection }}.countDocuments({{ test_data }})'
      register: verify_test_data_insertion
      changed_when: false

    - name: Upgrade MongoDB through each major version
      ansible.builtin.include_tasks: upgrade_mongodb.yml
      loop: "{{ upgrade_versions }}"
      loop_control:
        loop_var: upgrade_version

    - name: Verify MongoDB version after full upgrade
      ansible.builtin.command: mongosh --eval "db.version()"
      register: mongo_version_output_final
      changed_when: false

    - name: Print final MongoDB version
      ansible.builtin.debug:
        msg: "MongoDB upgraded successfully. Current version: {{ mongo_version_output_final.stdout }}"

    - name: Verify test data survives upgrade
      ansible.builtin.command: >
        mongosh {{ test_db }}
        --eval 'db.{{ test_collection }}.countDocuments({{ test_data }})'
      register: verify_test_data_after_final
      changed_when: false

    - name: Assert test data is intact
      ansible.builtin.assert:
        that: verify_test_data_after_final.stdout | int >= 1
        fail_msg: "Test data was lost during upgrade!"

  handlers:
    - name: Restart MongoDB service
      ansible.builtin.service:
        name: mongod
        state: restarted