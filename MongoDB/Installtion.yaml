- name: Setup MongoDB
  hosts: your_target_hosts
  gather_facts: true
  become: true

  vars:
    mongodb_major_version: "7.0"
    mongodb_minor_version: "7.0.2"
    mongodb_version: "{{ mongodb_major_version }}"   # fixed: was missing, referenced in templates

  tasks:
    - name: Check OS version
      ansible.builtin.setup:
      register: os_info

    - name: Check if MongoDB is installed
      ansible.builtin.command: mongod --version
      register: mongodb_installed
      failed_when: false
      changed_when: false

    - name: Fail with helpful message if MongoDB already installed
      ansible.builtin.fail:        # fixed: was 'meta: end_play' (no user message, too abrupt)
        msg: >
          MongoDB is already installed ({{ mongodb_installed.stdout | default('unknown version') }}).
          If you want to upgrade, run upgrade.yaml instead.
      when: mongodb_installed.rc == 0

    - name: Installation of MongoDB   # fixed: was 'Installion' (typo)
      block:
        - name: Installation of MongoDB on Ubuntu   # fixed: typo
          block:
            - name: Install MongoDB prerequisites (Ubuntu)
              ansible.builtin.apt:
                name:
                  - gnupg
                  - libcurl4
                  - wget
                  - lsb-release
                  - g++
                  - make
                state: present

            - name: Upload MongoDB .list file (Ubuntu)
              ansible.builtin.template:
                src: mongodb-org.list.j2
                dest: "/etc/apt/sources.list.d/mongodb-org-{{ mongodb_version }}.list"
                owner: root
                group: root
                mode: '0644'

            - name: Add MongoDB GPG key (Ubuntu)
              ansible.builtin.apt_key:
                url: "https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc"
                state: present

            - name: Add MongoDB repository (Ubuntu)
              ansible.builtin.apt_repository:
                repo: "deb [arch=amd64] https://repo.mongodb.org/apt/{{ ansible_distribution | lower }} {{ ansible_distribution_release }}/mongodb-org/{{ mongodb_version }} multiverse"
                state: present

            - name: Install MongoDB package (Ubuntu)
              ansible.builtin.apt:
                name: "mongodb-org={{ mongodb_minor_version }}"
                state: present

            - name: Start and enable MongoDB service
              ansible.builtin.service:
                name: mongod
                state: started
                enabled: true

            - name: Verify MongoDB service is running (Ubuntu)
              ansible.builtin.service_facts:          # fixed: was 'command: systemctl status' (always 'changed')
            - name: Assert mongod is active
              ansible.builtin.assert:
                that: "'mongod' in services and services['mongod']['state'] == 'running'"
                fail_msg: "MongoDB service is not running after installation"

          when: "'Ubuntu' in ansible_distribution"   # simplified: direct use of ansible_distribution

        - name: Installation of MongoDB on RHEL and CentOS   # fixed typo
          block:
            - name: Install MongoDB prerequisites (RHEL/CentOS)
              ansible.builtin.yum:
                name:
                  - gnupg2
                  - libcurl
                  - wget
                  - redhat-lsb-core
                  - gcc-c++
                  - make
                state: present

            - name: Upload MongoDB .repo file (RHEL/CentOS)
              ansible.builtin.template:
                src: mongodb-org.repo.j2
                dest: "/etc/yum.repos.d/mongodb-org-{{ mongodb_version }}.repo"
                owner: root
                group: root
                mode: '0644'

            - name: Install MongoDB package (RHEL/CentOS)
              ansible.builtin.yum:
                name: "mongodb-org-{{ mongodb_minor_version }}"
                state: present

            - name: Start and enable MongoDB service
              ansible.builtin.service:
                name: mongod
                state: started
                enabled: true

            - name: Verify MongoDB service is running (RHEL/CentOS)
              ansible.builtin.service_facts:          # fixed: was 'command: service mongod status'
            - name: Assert mongod is active
              ansible.builtin.assert:
                that: "'mongod' in services and services['mongod']['state'] == 'running'"
                fail_msg: "MongoDB service is not running after installation"

          when: ansible_distribution in ['RedHat', 'CentOS']

      when: mongodb_installed.rc != 0