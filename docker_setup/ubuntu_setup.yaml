---
# ubuntu_setup.yaml — Docker installation tasks for Ubuntu/Debian
# Called via 'import_tasks' from main.yaml — NO play header here.
# vars_files are already loaded by the parent play in main.yaml.

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key     # replaced: deprecated apt_key module
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker repository  # uses signed-by for modern apt security
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present             # fixed: was 'latest' (non-idempotent, triggers upgrades every run)
    update_cache: true
  notify: restart docker

- name: Start and enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker
    state: present

- name: Pull default Docker image
  community.docker.docker_image:
    name: "{{ image_name }}"
    source: pull

- name: Create containers
  community.docker.docker_container:
    name: "{{ container_name }}{{ item }}"
    image: "{{ image_name }}"
    command: "{{ container_command }}"
    state: present
  loop: "{{ range(1, container_count + 1) | list }}"   # updated: was legacy with_sequence
