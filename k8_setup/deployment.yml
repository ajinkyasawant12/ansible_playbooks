apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: test-namespace   # fixed: was top-level 'Namespace: ata-namespace' (wrong key, wrong level, typo)
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine   # updated: was nginx:1.14.2 (very old, known CVEs)
          ports:
            - containerPort: 80
          resources:                 # added: always define resource constraints
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"