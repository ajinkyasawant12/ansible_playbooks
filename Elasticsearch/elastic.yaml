---
# playbook to setup and install elasticsearch on target vm
#
# FIXED:  '---' must be the first line (was after the comment originally)
# FIXED:  Removed 'shell: source ~/.bashrc' — source is a shell built-in and
#         does NOT persist environment to subsequent Ansible tasks. Use
#         /etc/profile.d/ files or 'environment:' on individual tasks instead.
# FIXED:  'when: elasticsearch_version != "latest"' was repeated on every task;
#         now wrapped in a single block with one condition.
# FIXED:  Hardcoded JAVA_HOME build path replaced with dynamic variable.

- name: Install Elasticsearch
  hosts: localhost
  become: true

  vars:
    elasticsearch_version: "8.12.0"             # updated from 7.15.0
    elasticsearch_installation_dir: /opt/elasticsearch
    elasticsearch_src_dir: /tmp/elasticsearch-source
    java_home: "{{ ansible_env.JAVA_HOME | default('/usr/lib/jvm/java-11-openjdk') }}"  # fixed: was hardcoded build path

  tasks:
    - name: Create elastic group
      ansible.builtin.group:
        name: elastic

    - name: Create elastic user
      ansible.builtin.user:
        name: elastic
        group: elastic
        home: "{{ elasticsearch_installation_dir }}"
        shell: /bin/bash

    - name: Install required packages
      ansible.builtin.package:
        name:
          - gcc
          - make
          - wget
          - tar
          - gzip
          - java-11-openjdk-devel
        state: present

    - name: Create directories for Elasticsearch
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: elastic
        group: elastic
        mode: '0755'
      loop:
        - "{{ elasticsearch_src_dir }}"
        - "{{ elasticsearch_installation_dir }}"

    # All tasks below are now in ONE block with ONE 'when:' condition.
    # Before the fix, 'when: elasticsearch_version != "latest"' appeared
    # on 7 separate tasks — hard to maintain and easy to miss.
    - name: Download, build, and configure Elasticsearch
      when: elasticsearch_version != 'latest'
      block:
        - name: Download Elasticsearch source
          ansible.builtin.get_url:
            url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ elasticsearch_version }}-src.tar.gz"
            dest: "{{ elasticsearch_src_dir }}/elasticsearch-{{ elasticsearch_version }}-src.tar.gz"
            owner: elastic
            group: elastic

        - name: Extract Elasticsearch source
          ansible.builtin.unarchive:
            src: "{{ elasticsearch_src_dir }}/elasticsearch-{{ elasticsearch_version }}-src.tar.gz"
            dest: "{{ elasticsearch_src_dir }}"
            remote_src: true
            owner: elastic
            group: elastic

        - name: Compile Elasticsearch
          ansible.builtin.command: "./gradlew assemble"
          args:
            chdir: "{{ elasticsearch_src_dir }}/elasticsearch-{{ elasticsearch_version }}"
          become_user: elastic
          environment:
            JAVA_HOME: "{{ java_home }}"   # fixed: was hardcoded x86_64 build path

        - name: Copy Elasticsearch distribution
          ansible.builtin.command: >
            cp -R distribution/archives/tar/build/distributions/elasticsearch-{{ elasticsearch_version }}-SNAPSHOT.tar.gz
            {{ elasticsearch_installation_dir }}
          args:
            chdir: "{{ elasticsearch_src_dir }}/elasticsearch-{{ elasticsearch_version }}"
            creates: "{{ elasticsearch_installation_dir }}/elasticsearch-{{ elasticsearch_version }}-SNAPSHOT.tar.gz"
          become_user: elastic

        - name: Register Elasticsearch with update-alternatives
          ansible.builtin.command: >
            update-alternatives --install /usr/local/bin/elasticsearch elasticsearch
            {{ elasticsearch_installation_dir }}/elasticsearch-{{ elasticsearch_version }}/bin/elasticsearch 1

        - name: Add Elasticsearch to system PATH via profile.d
          ansible.builtin.lineinfile:
            path: /etc/profile.d/elasticsearch.sh    # fixed: system-wide, not per-user ~/.bashrc
            line: "export PATH={{ elasticsearch_installation_dir }}/elasticsearch-{{ elasticsearch_version }}/bin:$PATH"
            create: true
            mode: '0644'
          # NOTE: 'shell: source ~/.bashrc' was removed — it does nothing useful
          # in Ansible because each task runs in a fresh shell process.
          # PATH changes are applied by /etc/profile.d/ on next login or
          # by setting 'environment:' directly on tasks that need the binary.

        - name: Verify Elasticsearch installation
          ansible.builtin.command: "{{ elasticsearch_installation_dir }}/elasticsearch-{{ elasticsearch_version }}/bin/elasticsearch --version"
          changed_when: false