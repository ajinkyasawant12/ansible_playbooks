---
- hosts: localhost
  gather_facts: false

  # AWS credentials — DO NOT store access keys in plaintext YAML files.
  # Use one of these secure approaches instead:
  #   1. IAM role attached to EC2/EKS instance (recommended — no keys needed at all)
  #   2. Environment variables: export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
  #   3. ~/.aws/credentials file (managed by 'aws configure')
  #   4. ansible-vault encrypted vars file

  tasks:
    - name: Create S3 bucket
      amazon.aws.s3_bucket:              # updated: was deprecated bare 's3_bucket'
        name: "{{ bucket_name }}"
        # Credentials are picked up automatically from env vars or ~/.aws/credentials.
        # Only uncomment the lines below if you cannot use the above mechanisms:
        # aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        # aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        policy: "{{ lookup('file', 'bucket_policy.json') }}"
        state: present
        region: "{{ region_name }}"      # fixed: was '{{region_name}' (missing closing }})
        versioning: false                # fixed: was 'no' (boolean should be false)
        tags:
          Name: myansiblebucket
          Type: example