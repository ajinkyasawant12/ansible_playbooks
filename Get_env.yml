---
- name: Read and set specific environment variables from .bash_profile
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read .bash_profile
      ansible.builtin.slurp:              # replaced: was 'command: cat' (unnecessary shell-out)
        src: "{{ ansible_env.HOME }}/.bash_profile"
      register: bash_profile_raw

    - name: Decode profile content
      ansible.builtin.set_fact:
        bash_profile_content: "{{ bash_profile_raw.content | b64decode }}"

    - name: Extract environment variables   # combined: was 4 separate set_fact tasks
      ansible.builtin.set_fact:
        env_vars:
          TOP:        "{{ bash_profile_content | regex_search('export TOP=(.+)', '\\1') | first | default('') }}"
          JAVA_HOME:  "{{ bash_profile_content | regex_search('export Java_Home=(.+)', '\\1') | first | default('') }}"
          JAVA8_HOME: "{{ bash_profile_content | regex_search('export Java8_Home=(.+)', '\\1') | first | default('') }}"
          PERL_HOME:  "{{ bash_profile_content | regex_search('export Perl_home=(.+)', '\\1') | first | default('') }}"

    - name: Print extracted environment variables
      ansible.builtin.debug:
        msg: "{{ item.key }}={{ item.value }}"
      loop: "{{ env_vars | dict2items }}"   # updated: was legacy with_items:
